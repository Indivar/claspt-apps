[workspace]
members = ["crates/claspt-core", "src-tauri"]
resolver = "2"

[profile.dev]
opt-level = 0

# RSA key generation and signing at opt-level 0 take minutes; the SSH agent
# tests generate keys. Optimising just the big-number crates keeps debug
# builds of everything else as they are.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

# The mobile native library. `panic = "abort"` is right for the desktop
# binary, but across UniFFI it turns any Rust panic into a process kill
# instead of the InternalError the bindings would otherwise raise; a phone
# handed a malformed bundle by a hostile server must get an exception it can
# show, not a crash. Everything else matches release.
[profile.mobile]
inherits = "release"
panic = "unwind"
