<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claspt</title>
    <style>
      /* Inline splash — renders before any JS loads */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1a26;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo {
        animation: splash-pulse 2s ease-in-out infinite alternate;
      }
      #splash .brand {
        margin-top: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #f5c542, #e8930a);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #splash .spinner {
        margin-top: 24px;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(232, 147, 10, 0.2);
        border-top-color: #e8930a;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      #splash .status {
        margin-top: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
        letter-spacing: 0.05em;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-pulse {
        from {
          opacity: 0.85;
          transform: scale(1);
        }
        to {
          opacity: 1;
          transform: scale(1.03);
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen — visible immediately, removed by React -->
    <div id="splash">
      <img
        id="splash-logo"
        class="logo"
        width="148"
        height="148"
        src="/logo-dark-splash.png"
        srcset="/logo-dark-splash.png 1x, /logo-dark-splash@2x.png 2x"
        alt="Claspt"
        draggable="false"
      />
      <div class="brand">Claspt</div>
      <div class="spinner"></div>
      <div class="status">Loading vault...</div>
    </div>

    <div id="root"></div>
    <script>
      // Match splash bg to persisted theme before React loads
      try {
        var t = localStorage.getItem("claspt-theme") || "dark";
        var light = [
          "light",
          "solarized-light",
          "gruvbox-light",
          "catppuccin-latte",
          "github-light",
        ];
        if (light.indexOf(t) !== -1) {
          document.getElementById("splash").style.background = "#f3f3f7";
          document.querySelector("#splash .status").style.color = "rgba(0,0,0,0.25)";
          document.querySelector("#splash .spinner").style.borderColor =
            "rgba(232,147,10,0.15)";
          document.querySelector("#splash .spinner").style.borderTopColor = "#e8930a";
          // Swap to light logo
          var logo = document.getElementById("splash-logo");
          logo.src = "/logo-light-splash.png";
          logo.srcset = "/logo-light-splash.png 1x, /logo-light-splash@2x.png 2x";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
