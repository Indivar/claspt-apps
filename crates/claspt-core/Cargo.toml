[package]
name = "claspt-core"
version = "0.1.6"
edition = "2021"
rust-version = "1.77.2"
description = "Shared crypto, sync, and git core for Claspt desktop and mobile"
license = "PolyForm-Shield-1.0.0"

[dependencies]
# Crypto
ring = "0.17"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"

# Git (no vendored-openssl — mobile does networking in JS, desktop uses reqwest)
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
thiserror = "2"
slug = "0.1"

# Async/Network (optional — desktop enables, mobile uses JS networking)
tokio = { version = "1", features = ["sync", "time", "macros"], optional = true }
reqwest = { version = "0.12", features = ["rustls-tls", "multipart"], optional = true }

# FFI
uniffi = "0.28"

[target.'cfg(windows)'.dependencies]
# Owner-only DACLs for vault.key and friends; see src/fs_perms.rs.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[features]
default = []
# Sync bundles and their encryption; not in the public tree.
pro = []
uniffi-cli = ["uniffi/cli"]
network = ["dep:tokio", "dep:reqwest"]

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "claspt_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]
